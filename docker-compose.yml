services:
  webpreview_bot:
    container_name: deltachat_webpreview_bot
    build: .
    init: true
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - ./webpreview:/root/.config/webpreview
    environment:
      - DC_DB_DIR=/app/data
      - DB_PATH=/app/data/webpreview.db
      - TZ=UTC
      - ALLOWED_BOT_EMAILS=${ALLOWED_BOT_EMAILS:-}
      - KARAKEEP_URL=${KARAKEEP_URL:-}
      - KARAKEEP_API_KEY=${KARAKEEP_API_KEY:-}
      - KARAKEEP_TAGS=${KARAKEEP_TAGS:-}
      - ARCHIVE_TODAY_MIRRORS=${ARCHIVE_TODAY_MIRRORS:-}
      - ARCHIVE_TODAY_PROXY_URL=${ARCHIVE_TODAY_PROXY_URL:-}
      - WAYBACK_ACCESS_KEY=${WAYBACK_ACCESS_KEY:-}
      - WAYBACK_SECRET_KEY=${WAYBACK_SECRET_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
      - JINA_PROXY_URL=${JINA_PROXY_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_MODELS=${GEMINI_MODELS:-gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemma-4-31b-it}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_DOMAINS=${PROXY_DOMAINS:-}
      - DELETE_DEVICE_AFTER=${DELETE_DEVICE_AFTER:-3600}
      - DOWNLOAD_LIMIT=${DOWNLOAD_LIMIT:-1}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
